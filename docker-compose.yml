
services:

  api-server:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env   # Пробрасывает настройки из .env внутрь Linux-контейнера
    ports:
      - "8000:8000"  # Открываем доступ к FastAPI-серверу для Windows
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Сетевой мост для связи с Windows из докера
    volumes:
#      - $UPLOAD_DIR:/app/templates
#      - $SET_UP_DIR:/app/jobs
      - app-db-marker:/app/data  # Постоянный диск Docker, защищающий файл-маркер
#    depends_on:
#      - redis-service
    restart: always

